name: Weekly Insights Regeneration

on:
  # Cron disabled for safety until production dataset pipeline is connected in CI
  # schedule:
  #   - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-insights:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Safeguard Check (Prevent Sample Overwrites)
        run: |
          python -c "
          import os, sys, pandas as pd
          prod_path = 'data/real_reviews.csv'
          if not os.path.exists(prod_path):
              print(f'SAFEGUARD TRIGGERED: {prod_path} is gitignored and absent in CI.')
              print('Aborting workflow to prevent overwriting production insights with the 50-row sample.')
              sys.exit(1)
          df = pd.read_csv(prod_path)
          if len(df) < 1000:
              print(f'SAFEGUARD TRIGGERED: Dataset has only {len(df)} rows (< 1000). Aborting.')
              sys.exit(1)
          print(f'Dataset safety check passed: {len(df)} rows verified.')
          "

      - name: Run pipeline & regenerate insights
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          echo "Running report pipeline..."
          python report.py

      - name: Commit and push updated insights
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/insights.json dashboard/data/insights.js
          if git diff --staged --quiet; then
            echo "No changes in insights data. Nothing to commit."
          else
            git commit -m "chore(data): auto-update weekly insights [skip ci]"
            git push
          fi
